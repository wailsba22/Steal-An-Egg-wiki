<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pet Earnings Calculator | Nest Watch</title><meta name="description" content="Calculate pet earnings per second, minute, hour, and day with mutation multipliers."><link rel="stylesheet" href="site.css"></head><body><nav class="nav"><a class="brand" href="steal-an-egg-wiki.html">Nest Watch</a><a href="biomes.html">Biomes</a><a href="pets.html">Pets</a><a href="calculators.html">Earnings</a><a href="egg-calculator.html">Egg value</a></nav><main><div class="eyebrow">Tool 01</div><h1>How much will this pet make?</h1><p class="lead">Pick a pet, apply its mutation, and see the projected income across useful time windows.</p><div class="tool"><label for="pet">Pet</label><select id="pet"></select><label for="mutation">Mutation</label><select id="mutation"></select><label for="count">Number of pets</label><input id="count" type="number" min="1" value="1"><div class="result" id="result"></div></div><p class="footer">This calculator reads the base income in the pet index. It does not include boosts, offline limits, or event bonuses.</p></main><script src="data.js"></script><script>const pet=document.getElementById('pet'),mutation=document.getElementById('mutation');PETS.filter(p=>p.income.includes('/s')).forEach((p,i)=>pet.insertAdjacentHTML('beforeend',`<option value="${i}">${p.name} — ${p.income}</option>`));Object.keys(MUTATIONS).forEach(m=>mutation.insertAdjacentHTML('beforeend',`<option>${m}</option>`));function number(v){return parseFloat(v.replace(/[$,]/g,''))*({K:1e3,M:1e6,B:1e9}[v.match(/[KMB]/)?.[0]]||1)}function money(n){return '$'+n.toLocaleString(undefined,{maximumFractionDigits:2})}function calc(){const p=PETS.filter(p=>p.income.includes('/s'))[pet.value],rate=number(p.income)*MUTATIONS[mutation.value]*Number(document.getElementById('count').value||1);document.getElementById('result').innerHTML=`<strong>${money(rate)}/second</strong><br><span class="muted">${money(rate*60)} / minute · ${money(rate*3600)} / hour · ${money(rate*86400)} / day</span>`}document.querySelectorAll('select,input').forEach(e=>e.addEventListener('input',calc));calc()</script></body></html>
